<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>PDF Studio — Privacy Policy</title> <style> body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6;color:#1c1c1e;background:#fff} @media(prefers-color-scheme:dark){body{color:#f2f2f4;background:#111214}a{color:#8e95ff}} h1{font-size:28px;margin-bottom:4px}h2{font-size:20px;margin-top:32px} .updated{color:#6e6e73;font-size:14px;margin-bottom:32px}a{color:#4f59e6} nav{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;margin-bottom:24px} nav a.on{font-weight:600;text-decoration:none} </style> </head> <body> <nav id="langs"></nav> <main id="page"></main> <noscript><p>Please enable JavaScript to choose a language. This app collects no personal data.</p></noscript> <script> const P = {"en": ["PDF Studio — Privacy Policy", "Last updated: November 5, 2026", [["Overview", "PDF Studio is a PDF app for iPhone and iPad. This policy explains how the app handles your data.", []], ["Data collection", "PDF Studio does not collect, store or share any personal data.", ["Documents you create, edit or import are stored only on your device.", "The app does not connect to any server and works without an internet connection.", "No analytics, advertising or tracking libraries are used.", "No account or sign-in is required."]], ["Permissions", "The app uses these permissions only for the stated purpose, on your device:", ["Camera: to scan documents. Scans become PDFs on your device and are never sent anywhere.", "Photos: to turn the photos you pick into a PDF. The rest of your library is not accessed.", "Face ID or passcode: only if you turn on the app lock. Apple handles authentication; the app never sees your biometric data."]], ["Sharing and backups", "Your documents leave your device only when you share them or export a backup to a location you choose. Nothing is shared with third parties, advertising networks or analytics services.", []], ["Changes", "If this policy changes, the current version will be published on this page.", []], ["Contact", "Questions: github.com/hilalappss", []]]], "tr": ["PDF Studio — Gizlilik Politikası", "Son güncelleme: 5 Kasım 2026", [["Genel bakış", "PDF Studio, iPhone ve iPad için bir PDF uygulamasıdır. Bu politika, uygulamanın verilerinizi nasıl işlediğini açıklar.", []], ["Veri toplama", "PDF Studio hiçbir kişisel veri toplamaz, saklamaz veya paylaşmaz.", ["Oluşturduğunuz, düzenlediğiniz ya da içe aktardığınız belgeler yalnızca cihazınızda saklanır.", "Uygulama hiçbir sunucuya bağlanmaz ve internet olmadan çalışır.", "Analitik, reklam veya izleme kütüphanesi kullanılmaz.", "Hesap oluşturma ya da oturum açma gerekmez."]], ["İzinler", "Uygulama aşağıdaki izinleri yalnızca belirtilen amaçla, cihazınızda kullanır:", ["Kamera: belge taramak için. Taramalar cihazınızda PDF'e dönüşür, hiçbir yere gönderilmez.", "Fotoğraflar: seçtiğiniz fotoğrafları PDF'e dönüştürmek için. Galerinizin geri kalanına erişilmez.", "Face ID ya da parola: yalnızca uygulama kilidini açarsanız. Doğrulamayı Apple yapar; uygulama biyometrik verilerinizi hiç görmez."]], ["Paylaşım ve yedekleme", "Belgeleriniz yalnızca siz paylaştığınızda ya da seçtiğiniz bir yere yedek aldığınızda cihazınızdan çıkar. Üçüncü taraflar, reklam ağları veya analiz servisleriyle hiçbir şey paylaşılmaz.", []], ["Değişiklikler", "Bu politika güncellenirse güncel sürüm bu sayfada yayınlanır.", []], ["İletişim", "Sorularınız için: github.com/hilalappss", []]]], "de": ["PDF Studio — Datenschutzerklärung", "Zuletzt aktualisiert: 5. November 2026", [["Überblick", "PDF Studio ist eine PDF-App für iPhone und iPad. Diese Erklärung beschreibt, wie die App mit Ihren Daten umgeht.", []], ["Datenerhebung", "PDF Studio erhebt, speichert oder teilt keine personenbezogenen Daten.", ["Dokumente, die Sie erstellen, bearbeiten oder importieren, werden nur auf Ihrem Gerät gespeichert.", "Die App verbindet sich mit keinem Server und funktioniert ohne Internetverbindung.", "Es werden keine Analyse-, Werbe- oder Tracking-Bibliotheken verwendet.", "Kein Konto und keine Anmeldung erforderlich."]], ["Berechtigungen", "Die App nutzt diese Berechtigungen nur für den genannten Zweck auf Ihrem Gerät:", ["Kamera: zum Scannen von Dokumenten. Scans werden auf dem Gerät zu PDFs und nie versendet.", "Fotos: um ausgewählte Fotos in ein PDF umzuwandeln. Auf den Rest Ihrer Mediathek wird nicht zugegriffen.", "Face ID oder Code: nur wenn Sie die App-Sperre aktivieren. Die Authentifizierung übernimmt Apple; die App sieht Ihre biometrischen Daten nie."]], ["Teilen und Backups", "Ihre Dokumente verlassen Ihr Gerät nur, wenn Sie sie teilen oder ein Backup an einen von Ihnen gewählten Ort exportieren. Es wird nichts an Dritte, Werbenetzwerke oder Analysedienste weitergegeben.", []], ["Änderungen", "Wenn sich diese Erklärung ändert, wird die aktuelle Fassung auf dieser Seite veröffentlicht.", []], ["Kontakt", "Fragen: github.com/hilalappss", []]]], "es": ["PDF Studio — Política de privacidad", "Última actualización: 5 de noviembre de 2026", [["Resumen", "PDF Studio es una app de PDF para iPhone y iPad. Esta política explica cómo trata la app tus datos.", []], ["Recopilación de datos", "PDF Studio no recopila, almacena ni comparte datos personales.", ["Los documentos que creas, editas o importas se guardan solo en tu dispositivo.", "La app no se conecta a ningún servidor y funciona sin conexión a internet.", "No se usan bibliotecas de análisis, publicidad ni seguimiento.", "No se necesita cuenta ni inicio de sesión."]], ["Permisos", "La app usa estos permisos solo para el fin indicado, en tu dispositivo:", ["Cámara: para escanear documentos. Los escaneos se convierten en PDF en tu dispositivo y nunca se envían.", "Fotos: para convertir en PDF las fotos que elijas. No se accede al resto de tu fototeca.", "Face ID o código: solo si activas el bloqueo de la app. La autenticación la hace Apple; la app nunca ve tus datos biométricos."]], ["Compartir y copias de seguridad", "Tus documentos solo salen de tu dispositivo cuando los compartes o exportas una copia a un lugar que eliges. No se comparte nada con terceros, redes publicitarias ni servicios de análisis.", []], ["Cambios", "Si esta política cambia, la versión vigente se publicará en esta página.", []], ["Contacto", "Preguntas: github.com/hilalappss", []]]], "fr": ["PDF Studio — Politique de confidentialité", "Dernière mise à jour : 5 novembre 2026", [["Présentation", "PDF Studio est une app PDF pour iPhone et iPad. Cette politique explique comment l’app traite vos données.", []], ["Collecte de données", "PDF Studio ne collecte, ne stocke et ne partage aucune donnée personnelle.", ["Les documents que vous créez, modifiez ou importez sont stockés uniquement sur votre appareil.", "L’app ne se connecte à aucun serveur et fonctionne sans connexion internet.", "Aucune bibliothèque d’analyse, de publicité ou de suivi n’est utilisée.", "Aucun compte ni connexion n’est nécessaire."]], ["Autorisations", "L’app utilise ces autorisations uniquement pour l’usage indiqué, sur votre appareil :", ["Appareil photo : pour numériser des documents. Les scans deviennent des PDF sur l’appareil et ne sont jamais envoyés.", "Photos : pour transformer en PDF les photos que vous choisissez. Le reste de votre photothèque n’est pas consulté.", "Face ID ou code : seulement si vous activez le verrouillage de l’app. Apple gère l’authentification ; l’app ne voit jamais vos données biométriques."]], ["Partage et sauvegardes", "Vos documents ne quittent votre appareil que lorsque vous les partagez ou exportez une sauvegarde vers l’emplacement de votre choix. Rien n’est partagé avec des tiers, des réseaux publicitaires ou des services d’analyse.", []], ["Modifications", "Si cette politique change, la version en vigueur sera publiée sur cette page.", []], ["Contact", "Questions : github.com/hilalappss", []]]], "it": ["PDF Studio — Informativa sulla privacy", "Ultimo aggiornamento: 5 novembre 2026", [["Panoramica", "PDF Studio è un’app PDF per iPhone e iPad. Questa informativa spiega come l’app tratta i tuoi dati.", []], ["Raccolta dei dati", "PDF Studio non raccoglie, conserva né condivide dati personali.", ["I documenti che crei, modifichi o importi sono salvati solo sul tuo dispositivo.", "L’app non si collega ad alcun server e funziona senza connessione a internet.", "Non vengono usate librerie di analisi, pubblicità o tracciamento.", "Non servono account né accesso."]], ["Autorizzazioni", "L’app usa queste autorizzazioni solo per lo scopo indicato, sul tuo dispositivo:", ["Fotocamera: per scansionare documenti. Le scansioni diventano PDF sul dispositivo e non vengono mai inviate.", "Foto: per trasformare in PDF le foto che scegli. Il resto della libreria non viene letto.", "Face ID o codice: solo se attivi il blocco dell’app. L’autenticazione è gestita da Apple; l’app non vede mai i tuoi dati biometrici."]], ["Condivisione e backup", "I tuoi documenti lasciano il dispositivo solo quando li condividi o esporti un backup in un luogo che scegli. Nulla viene condiviso con terze parti, reti pubblicitarie o servizi di analisi.", []], ["Modifiche", "Se questa informativa cambia, la versione aggiornata sarà pubblicata in questa pagina.", []], ["Contatti", "Domande: github.com/hilalappss", []]]], "pt-BR": ["PDF Studio — Política de Privacidade", "Última atualização: 5 de novembro de 2026", [["Visão geral", "PDF Studio é um app de PDF para iPhone e iPad. Esta política explica como o app trata seus dados.", []], ["Coleta de dados", "O PDF Studio não coleta, armazena nem compartilha dados pessoais.", ["Os documentos que você cria, edita ou importa ficam apenas no seu dispositivo.", "O app não se conecta a nenhum servidor e funciona sem internet.", "Nenhuma biblioteca de análise, publicidade ou rastreamento é usada.", "Não é preciso conta nem login."]], ["Permissões", "O app usa estas permissões apenas para a finalidade indicada, no seu dispositivo:", ["Câmera: para digitalizar documentos. As digitalizações viram PDF no dispositivo e nunca são enviadas.", "Fotos: para transformar em PDF as fotos que você escolher. O restante da biblioteca não é acessado.", "Face ID ou código: apenas se você ativar o bloqueio do app. A autenticação é feita pela Apple; o app nunca vê seus dados biométricos."]], ["Compartilhamento e backup", "Seus documentos só saem do dispositivo quando você os compartilha ou exporta um backup para um local escolhido por você. Nada é compartilhado com terceiros, redes de anúncios ou serviços de análise.", []], ["Alterações", "Se esta política mudar, a versão atual será publicada nesta página.", []], ["Contato", "Dúvidas: github.com/hilalappss", []]]], "ru": ["PDF Studio — Политика конфиденциальности", "Последнее обновление: 5 ноября 2026 г.", [["Обзор", "PDF Studio — приложение для работы с PDF на iPhone и iPad. Эта политика объясняет, как приложение обращается с вашими данными.", []], ["Сбор данных", "PDF Studio не собирает, не хранит и не передаёт персональные данные.", ["Документы, которые вы создаёте, редактируете или импортируете, хранятся только на вашем устройстве.", "Приложение не подключается к серверам и работает без интернета.", "Не используются библиотеки аналитики, рекламы или отслеживания.", "Аккаунт и вход не требуются."]], ["Разрешения", "Приложение использует эти разрешения только для указанной цели и только на устройстве:", ["Камера: для сканирования документов. Сканы превращаются в PDF на устройстве и никуда не отправляются.", "Фото: чтобы превратить выбранные фото в PDF. К остальной медиатеке доступа нет.", "Face ID или код-пароль: только если вы включили блокировку приложения. Проверку выполняет Apple; приложение не видит ваши биометрические данные."]], ["Передача и резервные копии", "Документы покидают устройство, только когда вы ими делитесь или экспортируете резервную копию в выбранное вами место. Ничего не передаётся третьим лицам, рекламным сетям или сервисам аналитики.", []], ["Изменения", "Если политика изменится, актуальная версия будет опубликована на этой странице.", []], ["Контакты", "Вопросы: github.com/hilalappss", []]]], "ja": ["PDF Studio — プライバシーポリシー", "最終更新日：2026年11月5日", [["概要", "PDF StudioはiPhoneとiPad向けのPDFアプリです。このポリシーでは、アプリがあなたのデータをどう扱うかを説明します。", []], ["データの収集", "PDF Studioは個人データを収集、保存、共有しません。", ["作成、編集、読み込みした書類はあなたのデバイスにのみ保存されます。", "アプリはサーバに接続せず、インターネットなしで動作します。", "分析、広告、トラッキングのライブラリは使用していません。", "アカウントやサインインは不要です。"]], ["アクセス許可", "アプリは以下の許可を、記載の目的のためだけにデバイス上で使用します：", ["カメラ：書類のスキャンのため。スキャンはデバイス上でPDFになり、送信されることはありません。", "写真：選んだ写真をPDFにするため。ライブラリのその他の写真にはアクセスしません。", "Face IDまたはパスコード：アプリのロックを有効にした場合のみ。認証はAppleが行い、アプリが生体情報を見ることはありません。"]], ["共有とバックアップ", "書類がデバイスの外に出るのは、あなたが共有したときか、選んだ場所にバックアップを書き出したときだけです。第三者、広告ネットワーク、分析サービスとは何も共有しません。", []], ["変更", "このポリシーが変更された場合、最新版をこのページに掲載します。", []], ["お問い合わせ", "ご質問：github.com/hilalappss", []]]], "ko": ["PDF Studio — 개인정보 처리방침", "최종 업데이트: 2026년 11월 5일", [["개요", "PDF Studio는 iPhone과 iPad용 PDF 앱입니다. 이 방침은 앱이 사용자의 데이터를 어떻게 다루는지 설명합니다.", []], ["데이터 수집", "PDF Studio는 개인정보를 수집, 저장, 공유하지 않습니다.", ["생성, 편집, 가져온 문서는 사용자의 기기에만 저장됩니다.", "앱은 어떤 서버에도 연결하지 않으며 인터넷 없이 작동합니다.", "분석, 광고, 추적 라이브러리를 사용하지 않습니다.", "계정이나 로그인이 필요하지 않습니다."]], ["권한", "앱은 다음 권한을 명시된 목적으로만, 기기 안에서 사용합니다:", ["카메라: 문서 스캔용. 스캔은 기기에서 PDF로 바뀌며 어디로도 전송되지 않습니다.", "사진: 선택한 사진을 PDF로 만들기 위해. 나머지 사진 보관함에는 접근하지 않습니다.", "Face ID 또는 암호: 앱 잠금을 켠 경우에만. 인증은 Apple이 처리하며 앱은 생체 정보를 볼 수 없습니다."]], ["공유와 백업", "문서는 사용자가 공유하거나 직접 고른 위치로 백업을 내보낼 때만 기기 밖으로 나갑니다. 제3자, 광고 네트워크, 분석 서비스와는 아무것도 공유하지 않습니다.", []], ["변경", "이 방침이 바뀌면 최신 버전을 이 페이지에 게시합니다.", []], ["문의", "질문: github.com/hilalappss", []]]], "zh-Hans": ["PDF Studio — 隐私政策", "最后更新：2026年11月5日", [["概述", "PDF Studio 是一款适用于 iPhone 和 iPad 的 PDF 应用。本政策说明应用如何处理你的数据。", []], ["数据收集", "PDF Studio 不收集、存储或共享任何个人数据。", ["你创建、编辑或导入的文稿只保存在你的设备上。", "应用不连接任何服务器，无需联网即可使用。", "不使用任何分析、广告或跟踪库。", "无需账户或登录。"]], ["权限", "应用仅在你的设备上、为所述目的使用以下权限：", ["相机：用于扫描文稿。扫描件在设备上生成 PDF，绝不会被发送。", "照片：用于将你选择的照片转换为 PDF。不会访问图库中的其他内容。", "面容 ID 或密码：仅在你开启应用锁时使用。认证由 Apple 处理，应用无法看到你的生物识别数据。"]], ["共享与备份", "只有在你共享文稿或将备份导出到你选择的位置时，文稿才会离开设备。不会与第三方、广告网络或分析服务共享任何内容。", []], ["变更", "如本政策有变更，最新版本将发布在此页面。", []], ["联系方式", "如有疑问：github.com/hilalappss", []]]], "ar": ["PDF Studio — سياسة الخصوصية", "آخر تحديث: 5 نوفمبر 2026", [["نظرة عامة", "PDF Studio تطبيق لملفات PDF على iPhone وiPad. توضح هذه السياسة كيف يتعامل التطبيق مع بياناتك.", []], ["جمع البيانات", "لا يجمع PDF Studio أي بيانات شخصية ولا يخزنها ولا يشاركها.", ["تُحفظ المستندات التي تنشئها أو تعدّلها أو تستوردها على جهازك فقط.", "لا يتصل التطبيق بأي خادم ويعمل دون اتصال بالإنترنت.", "لا تُستخدم أي مكتبات للتحليلات أو الإعلانات أو التتبع.", "لا حاجة إلى حساب أو تسجيل دخول."]], ["الأذونات", "يستخدم التطبيق هذه الأذونات للغرض المذكور فقط وعلى جهازك:", ["الكاميرا: لمسح المستندات. تتحول عمليات المسح إلى PDF على الجهاز ولا تُرسل إلى أي مكان.", "الصور: لتحويل الصور التي تختارها إلى PDF. لا يتم الوصول إلى بقية مكتبتك.", "بصمة الوجه أو رمز الدخول: فقط إذا فعّلت قفل التطبيق. تتولى Apple التحقق، ولا يرى التطبيق بياناتك الحيوية أبدًا."]], ["المشاركة والنسخ الاحتياطي", "لا تغادر مستنداتك جهازك إلا عندما تشاركها أو تصدّر نسخة احتياطية إلى مكان تختاره. لا تتم مشاركة أي شيء مع أطراف ثالثة أو شبكات إعلانية أو خدمات تحليلات.", []], ["التغييرات", "إذا تغيّرت هذه السياسة، فسيتم نشر النسخة الحالية في هذه الصفحة.", []], ["التواصل", "للاستفسارات: github.com/hilalappss", []]]], "hi": ["PDF Studio — गोपनीयता नीति", "अंतिम अपडेट: 5 नवंबर 2026", [["अवलोकन", "PDF Studio iPhone और iPad के लिए एक PDF ऐप है। यह नीति बताती है कि ऐप आपके डेटा को कैसे संभालता है।", []], ["डेटा संग्रह", "PDF Studio कोई निजी डेटा एकत्र, संग्रहीत या साझा नहीं करता।", ["आपके बनाए, संपादित या आयात किए गए दस्तावेज़ केवल आपके डिवाइस पर रहते हैं।", "ऐप किसी सर्वर से कनेक्ट नहीं होता और बिना इंटरनेट के काम करता है।", "कोई एनालिटिक्स, विज्ञापन या ट्रैकिंग लाइब्रेरी उपयोग नहीं होती।", "किसी खाते या साइन-इन की ज़रूरत नहीं है।"]], ["अनुमतियाँ", "ऐप ये अनुमतियाँ केवल बताए गए उद्देश्य के लिए, आपके डिवाइस पर उपयोग करता है:", ["कैमरा: दस्तावेज़ स्कैन करने के लिए। स्कैन डिवाइस पर ही PDF बनते हैं और कहीं नहीं भेजे जाते।", "फ़ोटो: आपकी चुनी हुई फ़ोटो को PDF बनाने के लिए। बाकी लाइब्रेरी तक पहुँच नहीं होती।", "Face ID या पासकोड: केवल तब, जब आप ऐप लॉक चालू करें। प्रमाणीकरण Apple करता है; ऐप आपका बायोमेट्रिक डेटा कभी नहीं देखता।"]], ["साझा करना और बैकअप", "आपके दस्तावेज़ डिवाइस से तभी बाहर जाते हैं जब आप उन्हें साझा करें या अपनी चुनी जगह पर बैकअप निर्यात करें। तीसरे पक्ष, विज्ञापन नेटवर्क या एनालिटिक्स सेवाओं से कुछ भी साझा नहीं किया जाता।", []], ["परिवर्तन", "यदि यह नीति बदलती है, तो मौजूदा संस्करण इसी पेज पर प्रकाशित होगा।", []], ["संपर्क", "प्रश्नों के लिए: github.com/hilalappss", []]]], "id": ["PDF Studio — Kebijakan Privasi", "Terakhir diperbarui: 5 November 2026", [["Ringkasan", "PDF Studio adalah aplikasi PDF untuk iPhone dan iPad. Kebijakan ini menjelaskan cara aplikasi menangani data Anda.", []], ["Pengumpulan data", "PDF Studio tidak mengumpulkan, menyimpan, atau membagikan data pribadi apa pun.", ["Dokumen yang Anda buat, edit, atau impor hanya disimpan di perangkat Anda.", "Aplikasi tidak terhubung ke server mana pun dan bekerja tanpa internet.", "Tidak ada pustaka analitik, iklan, atau pelacakan yang digunakan.", "Tidak perlu akun atau masuk."]], ["Izin", "Aplikasi menggunakan izin berikut hanya untuk tujuan yang disebutkan, di perangkat Anda:", ["Kamera: untuk memindai dokumen. Hasil pindaian menjadi PDF di perangkat dan tidak pernah dikirim.", "Foto: untuk mengubah foto pilihan Anda menjadi PDF. Bagian lain perpustakaan foto tidak diakses.", "Face ID atau kode sandi: hanya jika Anda menyalakan kunci aplikasi. Autentikasi ditangani Apple; aplikasi tidak pernah melihat data biometrik Anda."]], ["Berbagi dan cadangan", "Dokumen Anda hanya keluar dari perangkat saat Anda membagikannya atau mengekspor cadangan ke lokasi pilihan Anda. Tidak ada yang dibagikan kepada pihak ketiga, jaringan iklan, atau layanan analitik.", []], ["Perubahan", "Jika kebijakan ini berubah, versi terbaru akan diterbitkan di halaman ini.", []], ["Kontak", "Pertanyaan: github.com/hilalappss", []]]]}; const NAMES = {"en": "English", "tr": "Türkçe", "de": "Deutsch", "es": "Español", "fr": "Français", "it": "Italiano", "pt-BR": "Português (Brasil)", "ru": "Русский", "ja": "日本語", "ko": "한국어", "zh-Hans": "简体中文", "ar": "العربية", "hi": "हिन्दी", "id": "Bahasa Indonesia"}; function pick(){ const q = new URLSearchParams(location.search).get("lang") || location.hash.slice(1); if (q && P[q]) return q; for (const l of navigator.languages || [navigator.language || "en"]) { if (P[l]) return l; const base = l.split("-")[0]; if (base === "zh") return "zh-Hans"; if (base === "pt") return "pt-BR"; if (P[base]) return base; } return "en"; } function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))} function render(lang){ const [title, updated, sections] = P[lang]; document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; document.title = title; let h = "<h1>" + esc(title) + "</h1><p class=updated>" + esc(updated) + "</p>"; for (const [head, text, items] of sections) { h += "<h2>" + esc(head) + "</h2><p>" + esc(text).replace("github.com/hilalappss", "<a href=https://github.com/hilalappss>github.com/hilalappss</a>") + "</p>"; if (items.length) h += "<ul>" + items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>"; } document.getElementById("page").innerHTML = h; document.getElementById("langs").innerHTML = Object.keys(P).map(l => "<a href=?lang=" + l + (l === lang ? " class=on" : "") + ">" + NAMES[l] + "</a>").join(""); } render(pick()); </script> </body> </html>
